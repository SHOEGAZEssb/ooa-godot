name: Validation

on:
  push:
    paths:
      - '.github/workflows/validation.yml'
      - '.gitmodules'
      - 'external/**'
      - 'src/**'
      - 'scenes/**'
      - 'validation/**'
      - 'tools/**'
      - 'project.godot'
      - 'oracle-of-ages.csproj'
      - 'oracle-of-ages.sln'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  GODOT_VERSION: 4.7.1-stable
  GODOT_ARCHIVE_SHA256: 764a089809fb1a6f745686ce9f6d3ca83adce8fb60fb9a4e2324b63baaebaa45

jobs:
  validate:
    name: Build and headless validation
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive

      - name: Set up .NET 8
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 8.0.x

      - name: Set up ROM build environment
        id: msys2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          update: true
          install: >-
            git
            make
            python
            python-yaml
            curl
            unzip

      - name: Rebuild verified Oracle of Ages source ROM
        shell: pwsh
        env:
          OOA_ROM_BUILD_BASH: ${{ steps.msys2.outputs.msys2-location }}/usr/bin/bash.exe
        run: |
          . .\tools\Resolve-OracleRom.ps1
          $rom = Resolve-OracleRom
          "ORACLES_ROM=$rom" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Test importer and verify deterministic generated assets
        shell: pwsh
        run: >-
          & .\tools\verify_oracle_import.ps1
          -Rom $env:ORACLES_ROM

      - name: Install verified Godot 4.7.1 .NET build
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'godot.zip'
          $installRoot = Join-Path $env:RUNNER_TEMP 'godot'
          $url = "https://github.com/godotengine/godot-builds/releases/download/$env:GODOT_VERSION/Godot_v$env:GODOT_VERSION`_mono_win64.zip"

          Invoke-WebRequest -Uri $url -OutFile $archive
          $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:GODOT_ARCHIVE_SHA256) {
              throw "Expected Godot archive SHA256 $env:GODOT_ARCHIVE_SHA256, got $actualHash."
          }

          Expand-Archive -LiteralPath $archive -DestinationPath $installRoot
          $console = Get-ChildItem -LiteralPath $installRoot -Recurse -File -Filter '*_console.exe' |
              Select-Object -First 1
          if ($null -eq $console) {
              throw 'Godot console executable was not present in the verified archive.'
          }
          "GODOT_CONSOLE=$($console.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build with zero warnings
        shell: pwsh
        run: dotnet build --configuration Debug -t:Rebuild -p:Optimize=true --warnaserror

      - name: Run complete headless validation
        shell: pwsh
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          & .\tools\validate_parallel.ps1 `
              -Godot $env:GODOT_CONSOLE `
              -Rom $env:ORACLES_ROM `
              -Workers 8 `
              -TimeoutSeconds 1800 `
              -FailOnEngineDiagnostics

      - name: Upload validation worker logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validation-worker-logs
          path: ${{ runner.temp }}/ooa-validation-*/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Check patch whitespace
        shell: pwsh
        run: git diff --check

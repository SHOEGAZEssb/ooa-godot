name: Release builds

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to rebuild
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  # The Windows Godot console waits for child processes, including idle build servers.
  UseSharedCompilation: 'false'
  MSBUILDDISABLENODEREUSE: '1'
  DOTNET_CLI_USE_MSBUILD_SERVER: '0'
  GODOT_VERSION: 4.7.1-stable
  GODOT_ARCHIVE_SHA256: 764a089809fb1a6f745686ce9f6d3ca83adce8fb60fb9a4e2324b63baaebaa45
  GODOT_TEMPLATES_SHA256: ef9a708be51ecd974cd7dccdcafd7a1870da3d3e1c24c072bdbb9818c7a7db63

jobs:
  release:
    name: Validate, export Windows/Linux/Android, and attach builds
    runs-on: windows-2025
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}

    steps:
      - name: Restore persistent Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if (-not $env:ANDROID_KEYSTORE_BASE64 -or -not $env:ANDROID_KEYSTORE_PASSWORD -or -not $env:ANDROID_KEY_ALIAS) {
              throw 'Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, and ANDROID_KEY_ALIAS repository secrets. Android updates require the same signing key on every run.'
          }
          $key = Join-Path $env:RUNNER_TEMP 'android-release.keystore'
          [System.IO.File]::WriteAllBytes($key, [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))
          "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$key" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$env:ANDROID_KEY_ALIAS" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$env:ANDROID_KEYSTORE_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Check out the released tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.release_tag }}
          submodules: recursive
          persist-credentials: false

      - name: Install release orchestration from the workflow revision
        run: |
          # A manual rebuild may target a tag whose launcher still throttles workers.
          # Keep game/validation source at the tag and use this workflow's orchestration.
          foreach ($name in @('validate_parallel.ps1', 'ValidationProcessJob.cs', 'Resolve-OracleRom.ps1')) {
              $url = "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_WORKFLOW_SHA/tools/$name"
              Invoke-WebRequest -Uri $url -OutFile (Join-Path 'tools' $name)
          }
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_WORKFLOW_SHA/Directory.Build.targets" `
              -OutFile Directory.Build.targets
          # Historical tags keep their original project and assembly identities.
          $gameBase = if (Test-Path -LiteralPath 'oracles.csproj') { 'oracles' } else { 'oracle-of-ages' }
          "GAME_PROJECT=$gameBase.csproj" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "VALIDATION_PROJECT=validation/$gameBase.validation.csproj" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "GAME_ASSEMBLY=$gameBase" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Exclude debug symbols from every release preset
        shell: python
        run: |
          import configparser
          from pathlib import Path

          path = Path("export_presets.cfg")
          presets = configparser.ConfigParser(interpolation=None)
          presets.read(path, encoding="utf-8")
          for section in presets.sections():
              if section.endswith(".options"):
                  presets[section]["dotnet/include_debug_symbols"] = "false"
          with path.open("w", encoding="utf-8", newline="\n") as stream:
              presets.write(stream, space_around_delimiters=False)

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          # Exact versions bypass the broken aka.ms download redirect.
          dotnet-version: |
            8.0.427
            9.0.320

      - name: Select the Android SDK toolchain
        run: |
          $sdkVersion = dotnet --list-sdks | Where-Object { $_ -match '^9\.' } |
              ForEach-Object { ($_ -split ' ')[0] } | Select-Object -Last 1
          if (-not $sdkVersion) { throw '.NET 9 SDK was not installed.' }
          @{ sdk = @{ version = $sdkVersion; rollForward = 'latestPatch' } } |
              ConvertTo-Json | Set-Content -LiteralPath global.json -Encoding utf8
          dotnet workload install android --skip-manifest-update
          if ($LASTEXITCODE -ne 0) { throw 'Android .NET workload installation failed.' }

          $env:JAVA_HOME = $env:JAVA_HOME_17_X64
          if (-not (Test-Path -LiteralPath "$env:JAVA_HOME/bin/keytool.exe")) {
              throw 'The runner must provide Java 17.'
          }
          "JAVA_HOME=$env:JAVA_HOME" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $sdkManager = Join-Path $env:ANDROID_HOME 'cmdline-tools/latest/bin/sdkmanager.bat'
          & $sdkManager 'platform-tools' 'platforms;android-35' 'platforms;android-36' `
              'build-tools;35.0.0' 'build-tools;35.0.1' 'build-tools;36.0.0'
          if ($LASTEXITCODE -ne 0) { throw 'Android SDK installation failed.' }

      - name: Set up ROM build environment
        id: msys2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          update: true
          install: >-
            git
            make
            python
            python-yaml
            curl
            unzip

      - name: Import verified game assets
        env:
          OOA_ROM_BUILD_BASH: ${{ steps.msys2.outputs.msys2-location }}/usr/bin/bash.exe
        run: |
          . ./tools/Resolve-OracleRom.ps1
          $rom = Resolve-OracleRom -LockTimeoutSeconds 0
          "ORACLES_ROM=$rom" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # The importer expects this output path; compile its contents as Release.
          dotnet build tools/OracleImporter/OracleImporter.csproj --configuration Release `
              -t:Rebuild -p:Optimize=true --warnaserror --output tools/OracleImporter/bin/Debug/net8.0
          if ($LASTEXITCODE -ne 0) { throw 'Release importer build failed.' }
          & ./tools/import_oracles.ps1 -Rom $rom -SkipBuild

      - name: Install verified Godot and .NET export templates
        run: |
          $baseUrl = "https://github.com/godotengine/godot-builds/releases/download/$env:GODOT_VERSION"
          function Get-VerifiedArchive($Name, $Destination, $ExpectedHash) {
              Invoke-WebRequest -Uri "$baseUrl/$Name" -OutFile $Destination
              $actualHash = (Get-FileHash -LiteralPath $Destination -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($actualHash -ne $ExpectedHash) {
                  throw "$Name SHA256 mismatch: expected $ExpectedHash, got $actualHash."
              }
          }
          $editorArchive = Join-Path $env:RUNNER_TEMP 'godot.zip'
          Get-VerifiedArchive "Godot_v$env:GODOT_VERSION`_mono_win64.zip" $editorArchive $env:GODOT_ARCHIVE_SHA256
          $installRoot = Join-Path $env:RUNNER_TEMP 'godot'
          Expand-Archive -LiteralPath $editorArchive -DestinationPath $installRoot
          $console = Get-ChildItem -LiteralPath $installRoot -Recurse -File -Filter '*_console.exe' |
              Select-Object -First 1
          if ($null -eq $console) { throw 'Godot console executable is missing.' }
          "GODOT_CONSOLE=$($console.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $editor = $console.FullName.Replace('_console.exe', '.exe')
          if (-not (Test-Path -LiteralPath $editor)) { throw 'Godot editor executable is missing.' }
          "GODOT_EDITOR=$editor" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          $templateArchive = Join-Path $env:RUNNER_TEMP 'godot-templates.zip'
          Get-VerifiedArchive "Godot_v$env:GODOT_VERSION`_mono_export_templates.tpz" $templateArchive $env:GODOT_TEMPLATES_SHA256
          $templateVersion = $env:GODOT_VERSION.Replace('-', '.') + '.mono'
          $templateRoot = Join-Path $env:APPDATA "Godot/export_templates/$templateVersion"
          [void][IO.Directory]::CreateDirectory($templateRoot)
          $zip = [IO.Compression.ZipFile]::OpenRead($templateArchive)
          try {
              # Extract only the targets used here, avoiding the large Apple templates.
              foreach ($name in @('windows_release_x86_64.exe', 'windows_release_x86_64_console.exe',
                      'linux_release.x86_64', 'android_release.apk')) {
                  $entry = $zip.GetEntry("templates/$name")
                  if ($null -eq $entry) { throw "Missing .NET export template: $name" }
                  [IO.Compression.ZipFileExtensions]::ExtractToFile($entry, (Join-Path $templateRoot $name))
              }
          }
          finally { $zip.Dispose() }

          # Godot reads these editor settings during headless Android export.
          $settingsRoot = Join-Path $env:APPDATA 'Godot'
          $javaPath = $env:JAVA_HOME.Replace('\', '/')
          $androidPath = $env:ANDROID_HOME.Replace('\', '/')
          @"
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$javaPath"
          export/android/android_sdk_path = "$androidPath"
          "@ | Set-Content -LiteralPath (Join-Path $settingsRoot 'editor_settings-4.7.tres') -Encoding utf8

      - name: Build Release production and validation assemblies
        run: |
          # Godot's editor host looks in Debug, regardless of compilation settings.
          # Stage Release assemblies there so validation needs no Debug build.
          $hostOutput = '.godot/mono/temp/bin/Debug'
          dotnet build $env:GAME_PROJECT --configuration ExportRelease `
              -t:Rebuild -p:Optimize=true --warnaserror --output $hostOutput
          if ($LASTEXITCODE -ne 0) { throw 'Release game build failed.' }
          dotnet build $env:VALIDATION_PROJECT --configuration Release `
              -t:Rebuild -p:Optimize=true -p:BuildProjectReferences=false --warnaserror `
              --output validation/bin/Debug/net8.0
          if ($LASTEXITCODE -ne 0) { throw 'Release validation build failed.' }

      - name: Import Godot resources
        run: |
          & $env:GODOT_CONSOLE --headless --editor --path . --import
          if ($LASTEXITCODE -ne 0) { throw 'Godot resource import failed.' }

      - name: Restore validation timing profile
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .godot/validation-timings.tsv
          key: validation-timings-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            validation-timings-${{ runner.os }}-${{ env.GODOT_VERSION }}-

      - name: Run complete headless validation
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          Write-Host "Validation host: $([Environment]::ProcessorCount) logical CPUs; no launcher CPU/RAM caps."
          & ./tools/validate_parallel.ps1 `
              -Godot $env:GODOT_CONSOLE `
              -Rom $env:ORACLES_ROM `
              -Workers 8 `
              -TimeoutSeconds 0 `
              -FailOnEngineDiagnostics

      - name: Save validation timing profile
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .godot/validation-timings.tsv
          key: validation-timings-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Prepare export launcher
        shell: python
        run: |
          import os
          from pathlib import Path

          # Generate this from the workflow, since a retried release tag may predate the fix.
          launcher = Path(os.environ["RUNNER_TEMP"]) / "export-godot.py"
          launcher.write_text(r'''
          import argparse
          import os
          from pathlib import Path
          import subprocess
          import sys
          import time

          parser = argparse.ArgumentParser()
          parser.add_argument("preset", choices=("Windows", "Linux", "Android"))
          parser.add_argument("output")
          args = parser.parse_args()
          Path(args.output).parent.mkdir(parents=True, exist_ok=True)
          log = Path(os.environ["RUNNER_TEMP"]) / f"godot-export-{args.preset.lower()}.log"
          command = [os.environ["GODOT_EDITOR"], "--headless", "--path", ".",
                     "--export-release", args.preset, args.output]
          started = time.monotonic()
          # Bypass the console wrapper's wait for all descendant processes (Godot #110101).
          # A regular file also prevents inherited stdout pipes from holding the CI step open.
          with log.open("w", encoding="utf-8") as output:
              with subprocess.Popen(command, stdout=output, stderr=subprocess.STDOUT,
                                    creationflags=subprocess.CREATE_NO_WINDOW) as process:
                  with log.open(encoding="utf-8", errors="replace") as reader:
                      while process.poll() is None:
                          print(reader.read(), end="", flush=True)
                          time.sleep(0.25)
                      print(reader.read(), end="", flush=True)
                  code = process.returncode
          print(f"{args.preset} editor exited with code {code} after {time.monotonic() - started:.1f}s; log: {log}")
          sys.exit(code)
          ''', encoding="utf-8")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as environment:
              environment.write(f"GODOT_EXPORT_LAUNCHER={launcher}\n")

      - name: Export Windows x64
        run: |
          python $env:GODOT_EXPORT_LAUNCHER Windows builds/windows/oracle-of-ages.exe
          if ($LASTEXITCODE -ne 0) { throw 'Windows export failed.' }

      - name: Export Linux x64
        run: |
          python $env:GODOT_EXPORT_LAUNCHER Linux builds/linux/oracle-of-ages.x86_64
          if ($LASTEXITCODE -ne 0) { throw 'Linux export failed.' }

      - name: Export Android ARM64
        run: |
          python $env:GODOT_EXPORT_LAUNCHER Android builds/android/oracle-of-ages.apk
          if ($LASTEXITCODE -ne 0) { throw 'Android export failed.' }
          $signer = Join-Path $env:ANDROID_HOME 'build-tools/36.0.0/apksigner.bat'
          & $signer verify builds/android/oracle-of-ages.apk
          if ($LASTEXITCODE -ne 0) { throw 'Android APK signature verification failed.' }
          $aapt = Join-Path $env:ANDROID_HOME 'build-tools/36.0.0/aapt2.exe'
          $badging = @(& $aapt dump badging builds/android/oracle-of-ages.apk)
          if ($LASTEXITCODE -ne 0) { throw 'Android manifest inspection failed.' }
          if ($badging -match '^application-debuggable') { throw 'Android release must not be debuggable.' }

      - name: Verify Android release contents
        shell: python
        run: |
          import os
          import zipfile

          with zipfile.ZipFile("builds/android/oracle-of-ages.apk") as apk:
              names = apk.namelist()
              unwanted = [name for name in names if name.endswith((".a", ".pdb"))]
              if unwanted:
                  raise SystemExit(f"Build-only files in Android release: {unwanted}")
              for required in ("lib/arm64-v8a/libgodot_android.so",
                               "lib/arm64-v8a/libmonosgen-2.0.so",
                               f"assets/.godot/mono/publish/arm64/{os.environ['GAME_ASSEMBLY']}.dll"):
                  if required not in names or apk.getinfo(required).file_size == 0:
                      raise SystemExit(f"Missing or empty Android runtime file: {required}")

      - name: Package complete builds and checksums
        shell: python
        run: |
          import hashlib
          import os
          from pathlib import Path
          import re
          import shutil
          import tarfile
          import zipfile

          version = re.sub(r"[^A-Za-z0-9._-]", "-", os.environ["RELEASE_TAG"]).strip(".")
          if not version:
              raise SystemExit("Release tag cannot produce an asset filename.")
          output = Path("builds/release")
          output.mkdir(parents=True, exist_ok=True)
          for required in ("windows/oracle-of-ages.exe", "windows/oracle-of-ages.pck",
                           "linux/oracle-of-ages.x86_64", "linux/oracle-of-ages.pck",
                           "android/oracle-of-ages.apk"):
              path = Path("builds") / required
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"Missing or empty export output: {path}")

          windows = Path("builds/windows")
          with zipfile.ZipFile(output / f"oracle-of-ages-{version}-windows-x64.zip", "w",
                               compression=zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(windows.rglob("*")):
                  if path.is_file():
                      archive.write(path, Path("oracle-of-ages") / path.relative_to(windows))

          def linux_permissions(info):
              info.mode = 0o755 if info.isdir() or info.name.endswith((".x86_64", ".sh")) else 0o644
              return info

          with tarfile.open(output / f"oracle-of-ages-{version}-linux-x64.tar.gz", "w:gz") as archive:
              archive.add("builds/linux", arcname="oracle-of-ages", filter=linux_permissions)
          shutil.copyfile("builds/android/oracle-of-ages.apk",
                          output / f"oracle-of-ages-{version}-android-arm64.apk")
          assets = sorted(output.iterdir())
          checksums = []
          for asset in assets:
              with asset.open("rb") as stream:
                  digest = hashlib.file_digest(stream, "sha256").hexdigest()
              checksums.append(f"{digest}  {asset.name}\n")
          (output / "SHA256SUMS.txt").write_text("".join(checksums), encoding="utf-8", newline="\n")

      - name: Upload builds to this release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem -LiteralPath builds/release -File | ForEach-Object { $_.FullName })
          if ($assets.Count -ne 4) { throw "Expected three builds and checksums, got $($assets.Count) assets." }
          gh release upload --repo $env:GITHUB_REPOSITORY --clobber -- $env:RELEASE_TAG @assets
          if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed.' }

      - name: Upload validation and export logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-diagnostic-logs
          path: |
            ${{ runner.temp }}/ooa-validation-*/*.log
            ${{ runner.temp }}/godot-export-*.log
          if-no-files-found: ignore
          retention-days: 7
